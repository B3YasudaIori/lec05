spring.application.name=lec05

# data.sql の日本語が文字化けしないようにする
spring.sql.init.encoding=UTF-8

# DB の URL（mem はメモリ上の DB なので，Spring Boot を止めると消える）
spring.datasource.url=jdbc:h2:mem:nekoneko

# JDBC ドライバ，ユーザ名，パスワード（なし）
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# h2-console を有効にする
spring.h2.console.enabled=true
